<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Dark Purple to Midnight Plum -->
    <linearGradient id="darkPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#150529"/>
    </linearGradient>

    <!-- Center Ambient Luminous Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Shadow for Note -->
    <filter id="stickyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#080212" flood-opacity="0.75"/>
    </filter>

    <!-- Warm Golden Honey Note Gradient -->
    <linearGradient id="warmNote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="cornerFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Washi Mint Tape -->
    <linearGradient id="washiMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald Leaf -->
    <linearGradient id="sproutGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- 100% Solid Full-Bleed Background (No transparent corners - so Android squircle is 100% Dark Purple!) -->
  <rect width="512" height="512" fill="url(#darkPurpleBg)"/>
  <rect width="512" height="512" fill="url(#centerGlow)"/>

  <!-- Warm Sunny Sticky Note with 3D drop shadow -->
  <g filter="url(#stickyShadow)">
    <!-- Base Note with Folded Bottom-Right Corner -->
    <path d="M 144 125
             L 368 125
             A 24 24 0 0 1 392 149
             L 392 327
             L 324 395
             L 144 395
             A 24 24 0 0 1 120 371
             L 120 149
             A 24 24 0 0 1 144 125 Z"
          fill="url(#warmNote)" stroke="#FDE047" stroke-width="2"/>

    <!-- Folded Flap -->
    <path d="M 324 395
             L 324 339
             A 12 12 0 0 1 336 327
             L 392 327 Z"
          fill="url(#cornerFlap)" stroke="#EAB308" stroke-width="2"/>
    <path d="M 324 327 L 392 327 L 324 395 Z" fill="#A16207" opacity="0.25"/>
  </g>

  <!-- Mint Washi Tape at Top -->
  <g filter="url(#stickyShadow)">
    <rect x="202" y="102" width="108" height="34" rx="8" fill="url(#washiMint)" stroke="#A7F3D0" stroke-width="2" opacity="0.95"/>
    <circle cx="220" cy="119" r="3" fill="#047857" opacity="0.45"/>
    <circle cx="238" cy="119" r="3" fill="#047857" opacity="0.45"/>
    <circle cx="256" cy="119" r="3" fill="#047857" opacity="0.45"/>
    <circle cx="274" cy="119" r="3" fill="#047857" opacity="0.45"/>
    <circle cx="292" cy="119" r="3" fill="#047857" opacity="0.45"/>
  </g>

  <!-- Crisp Deep Violet Ruled Lines -->
  <line x1="156" y1="190" x2="356" y2="190" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <line x1="156" y1="242" x2="356" y2="242" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <line x1="156" y1="294" x2="290" y2="294" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <line x1="156" y1="344" x2="240" y2="344" stroke="#4C1D95" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <!-- Bullets -->
  <circle cx="144" cy="190" r="4.5" fill="#6D28D9"/>
  <circle cx="144" cy="242" r="4.5" fill="#6D28D9"/>

  <!-- Glowing Emerald Seedling Sprout -->
  <g transform="translate(315, 326)">
    <path d="M 0 0 C 0 -18, 22 -18, 22 -3 C 22 12, 0 0, 0 0 Z" fill="url(#sproutGreen)"/>
    <path d="M 0 0 C 0 -22, -24 -22, -24 -6 C -24 10, 0 0, 0 0 Z" fill="#10B981"/>
    <path d="M 0 0 L 0 30" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Golden Sparkle Accent -->
  <path d="M 418 114 Q 418 126 406 126 Q 418 126 418 138 Q 418 126 430 126 Q 418 126 418 114 Z" fill="#FDE047"/>
</svg>
