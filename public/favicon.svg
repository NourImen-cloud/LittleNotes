<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Violet to Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="45%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0"/>
    </radialGradient>

    <!-- Sticky Note Shadow -->
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1E0738" flood-opacity="0.6"/>
    </filter>

    <!-- Sticky Note Paper Gradient: Warm Golden Amber -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="15%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Folded Corner Shadow & Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Washi Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Sprout Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background: Rich, Bold Royal Violet / Indigo -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="114" fill="url(#ambientGlow)"/>
  <!-- Subtle inner border highlight for native Apple feel -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#C4B5FD" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Warm Sunny Sticky Note with 3D drop shadow -->
  <g filter="url(#noteShadow)">
    <!-- Base Note Body with Folded Corner at Bottom-Right -->
    <path d="M 126 112
             L 386 112
             A 28 28 0 0 1 414 140
             L 414 342
             L 344 412
             L 126 412
             A 28 28 0 0 1 98 384
             L 98 140
             A 28 28 0 0 1 126 112 Z"
          fill="url(#noteGrad)" stroke="#FDE047" stroke-width="2"/>

    <!-- Folded Corner Flap -->
    <path d="M 344 412
             L 344 356
             A 14 14 0 0 1 358 342
             L 414 342 Z"
          fill="url(#foldGrad)" stroke="#EAB308" stroke-width="2"/>
    <!-- Folded Corner Inner Shadow -->
    <path d="M 344 342 L 414 342 L 344 412 Z" fill="#CA8A04" opacity="0.2"/>
  </g>

  <!-- Washi Tape Clip at Top Center -->
  <g filter="url(#noteShadow)">
    <rect x="196" y="86" width="120" height="38" rx="8" fill="url(#tapeGrad)" stroke="#A7F3D0" stroke-width="2" opacity="0.95"/>
    <circle cx="216" cy="105" r="3" fill="#047857" opacity="0.4"/>
    <circle cx="236" cy="105" r="3" fill="#047857" opacity="0.4"/>
    <circle cx="256" cy="105" r="3" fill="#047857" opacity="0.4"/>
    <circle cx="276" cy="105" r="3" fill="#047857" opacity="0.4"/>
    <circle cx="296" cy="105" r="3" fill="#047857" opacity="0.4"/>
  </g>

  <!-- Ruled Notebook Lines (Crisp Violet-Ink Lines) -->
  <line x1="146" y1="184" x2="366" y2="184" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="146" y1="240" x2="366" y2="240" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="146" y1="296" x2="286" y2="296" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="146" y1="352" x2="240" y2="352" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Bullet dots -->
  <circle cx="132" cy="184" r="5" fill="#4F46E5"/>
  <circle cx="132" cy="240" r="5" fill="#4F46E5"/>

  <!-- Emerald Seedling Sprout -->
  <g transform="translate(330, 332)">
    <path d="M 0 0 C 0 -18, 22 -18, 22 -3 C 22 12, 0 0, 0 0 Z" fill="url(#leafGrad)"/>
    <path d="M 0 0 C 0 -22, -24 -22, -24 -6 C -24 10, 0 0, 0 0 Z" fill="#10B981"/>
    <path d="M 0 0 L 0 30" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Accent on Upper Right -->
  <path d="M 438 92 Q 438 106 424 106 Q 438 106 438 120 Q 438 106 452 106 Q 438 106 438 92 Z" fill="#FDE047"/>
  <circle cx="456" cy="82" r="3.5" fill="#FEF08A"/>
</svg>
